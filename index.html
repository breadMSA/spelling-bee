<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1424" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spelling Bee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Spelling Bee 練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6;--card:#fff;--ink:#14203b;--mute:#5a6783;--rule:#d6deeb;--soft:#e3e9f3;
  --pen:#2347c9;--onpen:#fff;--red:#cf3a30;--ok:#1d7a4d;--hi:#ffe566;
  --line:#b9cbe8;--base:#4f74c9;
  --f:"Andika","Atkinson Hyperlegible",Verdana,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  /* four-line staff geometry, set by calibrate() */
  --s:15px;--F:29px;--m:6px;--H:57px;--pt:0px;--pb:0px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1424;--card:#151e33;--ink:#e8eefb;--mute:#93a0ba;--rule:#27324d;--soft:#1b2640;
  --pen:#7c9bff;--onpen:#0d1424;--red:#ff8f85;--ok:#6fd0a1;
  --line:#2f4166;--base:#6b8fd0}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--f)}
main{max-width:720px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}
a{color:inherit}
h2{font:700 21px/1.3 var(--f);margin:0}
p{margin:0}
.note{color:var(--mute);font-size:14px}
.ver{font-size:12px;margin-top:36px;opacity:.7}
body.focus .ver{display:none}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font:700 20px/1 var(--f);letter-spacing:.01em}
.acct{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);font-size:13px;text-decoration:none;white-space:nowrap}
.acct i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.acct.on i{background:var(--ok)}.acct.err i{background:var(--red)}.acct.busy i{background:var(--hi);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}

/* tab bar: pinned to the bottom on phones, inline on wide screens */
nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;background:var(--card);border-top:1px solid var(--rule);
  padding:0 max(6px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px, env(safe-area-inset-left))}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--mute);text-decoration:none;font-size:11.5px;line-height:1.2;position:relative}
nav a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--pen);font-weight:700}
nav .ct{position:absolute;top:4px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center}
body.focus nav{display:none}
body.focus .top{display:none}
body.focus main{padding-top:calc(12px + env(safe-area-inset-top))}
@media (min-width:760px){
  nav{position:static;border:0;background:none;padding:0;margin:0 0 22px;border-bottom:1px solid var(--rule)}
  nav a{flex:0 0 auto;flex-direction:row;gap:7px;padding:10px 16px;font-size:14.5px}
  nav a svg{width:18px;height:18px}
  nav a.on{box-shadow:inset 0 -2px 0 var(--pen)}
  nav .ct{position:static;margin-left:2px}
  main{padding-bottom:60px}
}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 24px;border-radius:12px;border:1.5px solid var(--pen);
  background:var(--pen);color:var(--onpen);font:700 15px/1 var(--f);cursor:pointer;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--rule)}
.btn.sec:hover{border-color:var(--mute)}
.btn.ghost{background:none;border-color:transparent;color:var(--mute);font-weight:400;padding:0 10px;text-decoration:underline;text-underline-offset:4px}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--red)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:18px}

/* settings controls */
.row{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin:16px 0 0}
.lab{color:var(--mute);font-size:14px;min-width:4.2em}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--soft);border-radius:12px;padding:3px}
.seg label{position:relative;display:flex;align-items:center;height:36px;padding:0 14px;border-radius:9px;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--rule)}
.seg label:has(input:focus-visible){outline:2px solid var(--pen);outline-offset:1px}
.opts{margin-top:18px;border-top:1px solid var(--rule);padding-top:4px}
.opts summary{cursor:pointer;color:var(--mute);font-size:14px;padding:10px 0;list-style:none}
.opts summary::-webkit-details-marker{display:none}
.opts summary::before{content:"▸ ";}
.opts[open] summary::before{content:"▾ "}
.field{display:block;width:100%;height:46px;padding:0 14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.field:focus{outline:0;border-color:var(--pen)}
textarea.field{height:auto;min-height:150px;padding:12px 14px;line-height:1.5;font-size:14px;resize:vertical}
.err{color:var(--red);font-size:14px;margin-top:10px}

/* four-line staff: the writing line for English words */
.staff{display:block;width:100%;max-width:26rem;height:var(--H);padding:var(--pt) 6px var(--pb);
  font:400 var(--F)/calc(var(--H) - var(--pt) - var(--pb)) var(--f);letter-spacing:.03em;color:var(--ink);
  border:0;border-radius:0;outline:0;margin:0;
  background:
    linear-gradient(var(--line),var(--line)) 0 var(--m)/100% 1px no-repeat,
    linear-gradient(var(--line),var(--line)) 0 calc(var(--m) + var(--s))/100% 1px no-repeat,
    linear-gradient(var(--base),var(--base)) 0 calc(var(--m) + 2*var(--s))/100% 1px no-repeat,
    linear-gradient(var(--line),var(--line)) 0 calc(var(--m) + 3*var(--s))/100% 1px no-repeat}
input.staff{background-color:transparent}
input.staff:focus{--line:var(--base)}
div.staff{display:inline-block;width:auto;min-width:14rem;white-space:nowrap}
.blank{display:inline-block;width:9em;max-width:60vw;margin:0 .2em;padding:0 6px;border:0;border-bottom:1.5px solid var(--ink);
  background:transparent;color:var(--ink);font:inherit;text-align:center;border-radius:0}
.blank:focus{outline:0;border-bottom-color:var(--pen);box-shadow:0 1.5px 0 var(--pen)}

/* quiz + practice items */
.q{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px 18px 20px;margin-bottom:12px}
.qn{display:block;color:var(--mute);font-size:13px;margin-bottom:6px}
.q.is-ok{border-color:var(--ok)}
.q.is-bad{border-color:var(--red)}
.q.is-ok::after,.q.is-bad::after{position:absolute;right:16px;top:12px;font:700 22px/1 var(--f)}
.q.is-ok::after{content:"✓";color:var(--ok)}
.q.is-bad::after{content:"✗";color:var(--red)}
.prompt{font-size:18px;line-height:1.7;margin-bottom:12px}
.prompt .pos{color:var(--mute);font-size:13px;margin-left:6px}
.prompt .fill{border-bottom:2px solid var(--ok);font-weight:700}
.hint{margin-top:8px;color:var(--mute);font-size:14px}
.pat{margin:-4px 0 12px;font-size:17px;letter-spacing:.2em}
.pat span{margin-left:14px;font-size:13px;letter-spacing:0;color:var(--mute)}
.verdict{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.typed{color:var(--red);text-decoration:line-through;font-size:16px}
.onlywrong .q.is-ok{display:none}
/* action bar pinned above the on-screen keyboard (--kb is set from visualViewport) */
.dock{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px max(16px, calc((100vw - 720px)/2 + 16px)) calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--rule)}
.dock .btn{min-width:7.5rem}
.dock-sp{height:88px}
@media (pointer:coarse){.kbhint{display:none}}
.sumry{padding:4px 0 20px}
.score{display:flex;align-items:baseline;gap:10px}
.score .n{font-size:60px;font-weight:700;line-height:1}
.score .of{color:var(--mute);font-size:18px}
.pcard{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:20px 18px 22px}
.pcard .prompt{font-size:21px}
.pcard.is-ok{border-color:var(--ok)}.pcard.is-bad{border-color:var(--red)}
.pbar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pen);border-radius:3px;transition:width .25s}
.phead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}

/* home: mastery map */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:2px 0 6px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{font-weight:700}
.sw{width:13px;height:13px;border-radius:3px;display:inline-block}
.deck{margin-top:22px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.dh h2{font-size:17px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(15px,1fr));gap:4px;max-width:520px}
.cell{aspect-ratio:1;width:100%;padding:0;border-radius:3px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.cell.new{border-color:var(--line)}.sw.new{border:1.5px solid var(--line)}
.cell.learning,.sw.learning{background:var(--line);border-color:var(--line)}
.cell.known,.sw.known{background:var(--pen);border-color:var(--pen)}
.cell.weak,.sw.weak{background:var(--red);border-color:var(--red)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;max-width:696px;margin:0 auto;
  background:var(--card);border:1px solid var(--ink);border-radius:16px;padding:14px 16px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
@media (min-width:760px){.sheet{bottom:24px}}
.sheet .w{font-size:22px}
.sheet .x{position:absolute;right:6px;top:6px}
.routine{margin:0 0 6px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 4px}
.wd{border:1px solid var(--rule);border-radius:10px;padding:5px 0 6px;text-align:center;font-size:11.5px;color:var(--mute);line-height:1.3}
.wd b{display:block;font-size:15px;color:var(--ink)}
.wd.now{background:var(--pen);color:var(--onpen);border-color:var(--pen)}.wd.now b{color:var(--onpen)}
.task{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--rule)}
.task:first-of-type{margin-top:10px}
.task .tt{font-weight:700}
.task.done .tt::after{content:" ✓";color:var(--ok)}
.task .go{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pick{display:inline-flex;align-items:center;justify-content:space-between;gap:14px;min-width:12rem;height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.pick:hover{border-color:var(--mute)}
.pick svg{color:var(--mute)}
.pk-back{position:fixed;inset:0;z-index:20;background:rgba(8,13,26,.55);display:flex;align-items:flex-end;justify-content:center}
.pk{width:100%;max-width:520px;max-height:78vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom));outline:0;animation:pkup .18s ease-out}
@keyframes pkup{from{transform:translateY(24px);opacity:.4}}
.pk-grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:6px auto 10px}
.pk-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 4px;border:0;border-top:1px solid var(--rule);background:none;color:var(--ink);font:inherit;font-size:16px;text-align:left;cursor:pointer}
.pk-row:first-of-type{border-top:0}
.pk-row.on{font-weight:700;color:var(--pen)}
.pk-row.on::before{content:"✓";margin-right:10px}
.pk-row.on span:first-child{margin-right:auto}
.pk-h{margin:16px 0 8px;color:var(--mute);font-size:13px}
.pk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pk-chip{height:46px;border-radius:12px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.pk-chip.on{background:var(--pen);border-color:var(--pen);color:var(--onpen);font-weight:700}
@media (min-width:760px){.pk-back{align-items:center}.pk{border-radius:22px;max-height:70vh}.pk-grab{display:none}}
.oldw>summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;cursor:pointer;list-style:none}
.oldw>summary::-webkit-details-marker,.wrow>summary::-webkit-details-marker{display:none}
.oldw>summary h2{font-size:17px}
.oldw>summary h2::before{content:"▸ "}.oldw[open]>summary h2::before{content:"▾ "}
.wrow{border-top:1px solid var(--rule);margin-top:8px}
.wrow>summary{display:grid;grid-template-columns:5.5em 1fr auto;gap:12px;align-items:center;padding:11px 0;cursor:pointer;list-style:none}
.wrow[open]>summary{padding-bottom:8px}
.wrow .map{margin:0 0 10px}
.mini{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--pen)}
.homego{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

/* word list */
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.find{height:44px;width:100%;max-width:22rem;padding:0 14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.find:focus{outline:0;border-color:var(--pen)}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.lt{min-width:34px;height:34px;padding:0 8px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:400 14px var(--f);cursor:pointer}
.lt.on{background:var(--pen);color:var(--onpen);border-color:var(--pen);font-weight:700}
.lt.starf{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:34px}
.lt.starf svg{fill:none;stroke:currentColor;stroke-width:1.7}
.lt.starf[aria-pressed="true"]{background:var(--hi);color:#14203b;border-color:var(--hi)}
.lt.starf[aria-pressed="true"] svg{fill:currentColor}
.entry{display:grid;grid-template-columns:2.4rem 1fr auto;column-gap:8px;padding:15px 0;border-top:1px solid var(--rule)}
.entry[hidden]{display:none}
.star{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:10px;color:var(--mute);cursor:pointer}
.star svg{fill:none;stroke:currentColor;stroke-width:1.6}
.star:hover{color:var(--ink)}
.star.on{color:#d6a800}
.star.on svg{fill:var(--hi);stroke:#c69a00}
.say{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:8px;color:var(--mute);cursor:pointer;vertical-align:middle;margin-left:2px}
.say svg{fill:currentColor;stroke:currentColor;stroke-width:1.4}
.say svg path+path{fill:none;stroke-linecap:round}
.say:hover{color:var(--ink)}
.nosay .say{display:none}
.entry .no{color:var(--mute);font-size:13px;padding-top:5px}
.w{font-weight:700;font-size:21px;line-height:1.4}
.pos{color:var(--mute);font-size:13px;font-weight:400;margin-left:8px}
.d{margin:2px 0 4px}
.s{color:var(--mute);font-size:14px}
.s b,.d b{color:var(--ink)}
.m-word .w:not(.rev){filter:blur(7px);cursor:pointer;user-select:none}
.m-def .d:not(.rev),.m-def .s:not(.rev){filter:blur(6px);cursor:pointer;user-select:none}
.meta{color:var(--mute);font-size:13px;margin-top:4px}
.empty{padding:26px 0;color:var(--mute)}
.empty .btn{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:3px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card)}

/* history */
.h{border-top:1px solid var(--rule)}
.h summary{display:grid;grid-template-columns:7.2em 1fr auto;gap:12px;align-items:baseline;padding:14px 0;cursor:pointer;list-style:none}
.h summary::-webkit-details-marker{display:none}
.h .sc{font-weight:700;font-size:18px}
.h .wl{padding:0 0 16px 7.2em}
.h .wl div{display:flex;gap:14px;align-items:baseline}

/* account */
.steps{margin:8px 0 0;padding-left:1.3em;font-size:14px;color:var(--mute)}
.steps li{margin:3px 0}
.steps b{color:var(--ink)}
form .field+.field{margin-top:10px}
@media (max-width:520px){
  .prompt{font-size:17px}
  .pcard .prompt{font-size:20px}
  .h .wl{padding-left:0}
  .h summary{grid-template-columns:6em 1fr auto}
  .score .n{font-size:50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand">Spelling Bee</div><a class="acct" id="acct" href="#me"></a></div>
  <nav id="nav"></nav>
  <div id="app"></div>
  <p class="note ver">版本 <span id="ver"></span></p>
</main>
<div class="sheet" id="sheet" hidden></div>

<script>

ous to humans.|Alexa shrieked when the huge tarantula ran over her face.\ntemperature|n|a measurement that indicates how hot or cold something is.|In Washington, D.C., the average temperature ranges from about 30 degrees in winter to about 86 degrees in summer.\ntemple|n|a building dedicated to the worship of a god or gods.|The Johnsons admired the beautiful Longshan Temple in Taipei City.\nterrorist|n|someone who uses violent action, or threats of violent action, for political purposes.|An unknown terrorist group has claimed responsibility for this morning's bomb attack.\ntilde|n|the mark “~” used in some languages (such as Spanish and Portuguese) to show that the letter “n” is pronounced /nj/ or that a vowel is pronounced in a different way.|Marcia could not find the tilde on the keyboard when she wanted to type the word “jalapeño”.\ntombstone|n|a stone that marks the place where a dead person is buried and that usually has the person's name and birth and death dates on it; a gravestone.|Marie's name is misspelled on the tombstone.\ntough|adj|very difficult to do, deal with, or comprehend.|The questions on the final exam were so tough that only the well-prepared students got a passing grade.\ntrilogy|n|a series of three novels or movies that are closely related and involve the same characters or themes.|The third novel in the trilogy “The Lord of the Rings” completed the whole story.\nubiquitous|adj|seeming to be seen everywhere.|The 7-11 store is ubiquitous in Taiwan.\nunchangeable|adj|not capable of being made different.|Mr. Chang denied that age makes habits unchangeable.\nunicorn|n|an imaginary animal that looks like a horse and has a straight horn growing from the middle of its forehead.|Sarah has a picture of a beautiful white unicorn on her wall.\nunique|adj|used to say that something or someone is unlike anything or anyone else.|The shape of each and every snowflake is unique.\nuniverse|n|all of space and everything in it, including stars, planets, and galaxies.|We humans have advanced greatly in our knowledge of the universe.\nunnatural|adj|strange; not normal.|Throughout the year, Ryan has dyed his hair all sorts of unnatural colors.\nvaccinate|v|to give a person or an animal a vaccine to prevent infection by a disease.|In order to prevent the spread of COVID, it was important to fully vaccinate as many people as possible in Taiwan.\nvaluable|adj|worth a lot of money.|The gold watch is extremely valuable.\nvegetarian|adj|describing a diet, meal, or menu that does not include meat.|After spending two years in Japan, Annabelle now follows a vegetarian diet.\nvenue|n|the place where an event takes place.|Rosie chose a fancy restaurant as the venue for her birthday party.\nversus|prep|against.|Katerina sometimes feels like it's her versus the rest of the world.\nveterinarian|n|a person who is trained to give medical care and treatment to animals; an animal doctor.|The veterinarian removed a large splinter from Misty's paw.\nvinegar|n|a sour liquid that is used to flavor or preserve foods or to clean things.|Pete used vinegar in the salad dressing.\nvolcano|n|a mountain with a hole in the top or side that sometimes sends out rocks, ash, or lava, in a sudden explosion.|The volcano last erupted 25 years ago.\nwarrior|n|a person who fights in battles and is known for having courage and skill.|The brave warrior sacrificed his life to save the king.\nwasteful|adj|using more of something than is needed, or causing something valuable to be wasted.|The new boss told everybody that they must avoid the wasteful use of paper.\nweird|adj|unusual or very strange.|Candy does not care for science-fiction movies because she feels the stories are usually too weird.\nwizard|n|a person who is skilled in magic or who has magical powers; a magician.|The wizard vowed to use his powers to help the townspeople.\nworkaholic|n|a person who chooses to work a lot; a person who is always working or thinking about work.|Beth is a workaholic who hasn't taken a vacation in over six years.\nxenophobia|n|fear, hatred, or dislike of strangers or foreigners.|Having learned a strong sense of xenophobia from his parents, Max would never speak to students from other countries.\nxenophobic|adj|showing an extreme dislike or fear of people from foreign countries.|Roger's xenophobic personality made him unfit for being a tour guide.\nyearling|n|an animal that is between one and two years old.|Although its small size made Ken think the rabbit was a yearling, it was actually closer to three years old.\nyeast|n|a type of fungus that is used in making alcoholic drinks such as beer and wine, and in baking to help make dough rise.|Martin's mother explained to him that you must mix flour, yeast, and water to make bread.\nzigzaggedness|n|used to describe something that has short sharp turns or angles.|Driving up the mountain, we became scared of the dangerous zigzaggedness of the road.\nzoology|n|the branch of science that involves the study of animals and animal behavior.|It is surprising that Gretchen, an animal lover, dreads her studies in zoology.\nzucchini|n|a dark green vegetable that is long and smooth and that has soft skin which can be eaten.|Tim picked a large zucchini from his garden so that he could slice it and grill it for dinner."}, {"id": "w01", "name": "加強・第 1 週", "short": "第 1 週", "text": "accommodate|v|to provide space for; to adjust to someone's needs.|The small hotel can accommodate sixty guests.\naccomplish|v|to succeed in doing or finishing something.|With a little teamwork, we can accomplish the whole project by Friday.\nacquiesce|v|to accept or agree to something reluctantly, without putting up a fight.|After an hour of begging, Dad decided to acquiesce and let the puppy sleep on the bed.\nagoraphobia|n|a fear of open or crowded public places.|Agoraphobia kept her from walking through the busy market.\nambidextrous|adj|able to use the left hand and the right hand equally well.|The ambidextrous pitcher could throw with either arm.\nambitious|adj|having a strong desire to succeed or achieve something big.|The ambitious intern asked to lead the next project.\nameliorate|v|to make a bad or painful situation better.|The city planted trees along the highway to ameliorate the heat and noise.\nanachronism|n|something placed in the wrong time period, or something that feels badly out of date.|A wristwatch on a Roman soldier in the movie was an obvious anachronism.\nanemone|n|a small plant with cup-shaped flowers; also a sea creature with soft, waving tentacles.|A clownfish hid among the tentacles of the anemone.\nangst|n|a deep, restless feeling of anxiety about life.|The teenager's poems were full of angst.\nantithesis|n|the exact opposite of something.|Her quiet, tidy desk was the antithesis of her brother's messy room.\napocalyptic|adj|describing the complete destruction of the world.|The film's apocalyptic scenes showed cities buried under ash.\napparent|adj|easy to see or understand; obvious.|It was apparent from her smile that the interview had gone well.\napproximately|adv|close to a number or amount, but not exactly.|The hike takes approximately three hours each way.\narachnophobia|n|an intense fear of spiders.|Her arachnophobia made her scream at the tiny spider in the sink.\nasphyxiate|v|to cut off someone's air supply so that they cannot breathe.|The thick smoke threatened to asphyxiate everyone in the room.\nbargain|n|something bought for much less than its usual price.|The coat was a bargain at half the normal price.\nbellicose|adj|eager to fight; aggressive.|The bellicose neighbor argued with everyone on the street.\nbellwether|n|something that shows which way a trend is heading.|The state is a bellwether for national elections.\nblitzkrieg|n|a sudden, fast, overwhelming military attack.|The army's blitzkrieg crushed the defenders in a matter of days.\nboundary|n|a line that marks the edge of an area.|A low stone wall marks the boundary between the two farms.\nbourgeois|adj|belonging to the comfortable middle class, often with a concern for money and appearances.|The novel mocks a bourgeois family obsessed with owning the biggest house on the street.\nbourgeoisie|n|the middle class of a society, especially as seen by its critics.|The revolutionaries blamed the bourgeoisie for the workers' poverty.\nbruschetta|n|grilled bread rubbed with garlic and topped with tomato and olive oil, an Italian appetizer.|We shared a plate of bruschetta before the pasta arrived.\nbureaucracy|n|a system of management with many rules and officials; red tape.|Getting a permit meant wading through endless layers of bureaucracy.\ncacophony|n|a harsh, jarring mixture of loud sounds.|A cacophony of car horns filled the intersection during rush hour.\ncamaraderie|n|friendly trust and companionship among people who spend a lot of time together.|The camaraderie among the rescue crew kept their spirits up through the long night.\ncappuccino|n|an Italian coffee drink topped with thick, frothy milk.|He sprinkled cocoa over his cappuccino.\ncartilage|n|the tough, bendy tissue that shapes the ear and cushions the joints.|He tore the cartilage in his knee during the match.\ncellophane|n|a thin, clear, glossy wrapping material.|She wrapped the basket of fruit in cellophane and tied a ribbon.\ncemetery|n|a place where dead people are buried.|They placed flowers on the grave in the quiet cemetery.\nceremony|n|a formal event held to mark something important.|The graduation ceremony began with a long march of students.\nchameleon|n|a lizard that changes its skin color to match its surroundings.|The chameleon turned green and vanished against the leaves.\ncharlatan|n|a person who pretends to have skill or knowledge that they do not have.|The so-called doctor was a charlatan selling colored water.\nchauffeur|n|a person employed to drive someone else's car.|The chauffeur opened the door of the limousine for the mayor.\nchiaroscuro|n|a painting technique that uses strong contrast between light and dark.|Rembrandt's chiaroscuro makes the faces glow against deep shadow.\nchimera|n|a monster in Greek myth made of parts of different animals; also an impossible dream.|The statue showed a chimera with a lion's head and a serpent's tail.\nchrysanthemum|n|a garden flower with a thick, rounded head of many petals.|A single yellow chrysanthemum stood in the vase.\nchutzpah|n|bold nerve; shameless confidence.|It took chutzpah to ask the boss for a raise on his first day.\ncircumstance|n|a condition or fact that affects a situation.|Under no circumstance should you open the door for a stranger.\nclandestine|adj|done in secret, especially because it is not allowed.|The spies held a clandestine meeting in an empty parking garage.\nclaustrophobia|n|a fear of small, enclosed spaces.|Claustrophobia made him take the stairs instead of the elevator.\ncolloquial|adj|used in everyday, informal speech.|Gonna is a colloquial form of going to.\nconnoisseur|n|an expert judge of fine things such as food, wine, or art.|As a cheese connoisseur, she could name the farm from a single bite.\nconscience|n|the inner sense of what is right and wrong.|His conscience bothered him after he told the lie.\nconscientious|adj|careful and thorough, and eager to do a task properly.|The conscientious nurse double-checked every dose before handing it over.\nconundrum|n|a confusing problem or riddle that is hard to solve.|Which road to take was a real conundrum with the map blown away.\ncourageous|adj|brave when facing danger or difficulty.|The courageous firefighter ran back into the burning house.\ncriticize|v|to point out the faults of someone or something.|Teachers should criticize the work, not the student.\ncurmudgeon|n|a bad-tempered, stubborn person, usually an older one.|The old curmudgeon yelled whenever a ball landed in his garden.\ndachshund|n|a small dog with a long body and very short legs.|The dachshund squeezed under the sofa to chase a ball.\ndebris|n|scattered broken pieces left after something is destroyed.|After the storm, debris covered the road.\ndefinitely|adv|without any doubt; certainly.|I will definitely be there before the movie starts.\ndenouement|n|the final part of a story, where everything is explained and settled.|The mystery's denouement revealed that the butler had done it.\ndesperate|adj|willing to try anything because the situation is so bad.|The desperate hikers waved at the passing plane.\ndiaphanous|adj|light, delicate, and see-through.|She wore a diaphanous scarf that floated in the breeze.\ndiarrhea|n|a stomach illness in which the body passes loose, watery waste too often.|Drinking dirty water gave the hikers diarrhea.\ndilemma|n|a hard choice between two options that are both unpleasant.|She faced a dilemma: tell the truth or protect her friend.\ndilettante|n|a person who dabbles in a subject for pleasure without real skill or commitment.|The dilettante took up painting, then piano, then pottery, and quit each within a month.\ndirigible|n|a large, steerable, balloon-like aircraft; an airship.|A silver dirigible floated slowly over the stadium.\nebullient|adj|bubbling over with cheerful energy.|The ebullient coach hugged every player after the win.\nechelon|n|a level or rank in an organization.|Only people in the upper echelon of the company had a private office.\neffervescent|adj|bubbling; also lively and full of enthusiasm.|The effervescent soda fizzed over the rim of the glass.\nefficient|adj|working well without wasting time or effort.|The new dishwasher is quiet and very efficient.\nennui|n|a feeling of boredom and weary dissatisfaction.|A long, rainy Sunday filled him with ennui.\nenormous|adj|extremely large.|An enormous wave rolled toward the surfers.\nentrepreneur|n|a person who starts a business and takes financial risks to run it.|The young entrepreneur sold handmade candles from a tiny booth.\nephemeral|adj|lasting only a very short time.|Snowflakes are ephemeral, melting the moment they touch warm skin.\nepiphany|n|a sudden, striking realization.|In the shower she had an epiphany about how to fix the code.\nepitome|n|a perfect example of a quality or type.|With her patience and kindness, Ms. Lin was the epitome of a good teacher.\nequanimity|n|calmness of mind, especially in a difficult situation.|He accepted the bad news with remarkable equanimity.\nesophagus|n|the tube that carries food from the throat to the stomach.|The pill got stuck in her esophagus and made her cough.\neuphemism|n|a mild word used in place of one that sounds harsh.|Passed away is a common euphemism for died.\nexacerbate|v|to make a problem or an injury worse.|Scratching the rash will only exacerbate the itching.\nexaggerate|v|to describe something as bigger or better than it really is.|Fishermen often exaggerate the size of the one that got away.\nfacetious|adj|joking at a moment when seriousness is expected.|His facetious reply to the judge's question did not make her laugh.\nfascinate|v|to hold someone's attention with great interest.|Space has always seemed to fascinate young children.\nfastidious|adj|very careful about details and hard to please, especially about cleanliness.|The fastidious chef wiped the counter after every single order.\nfiasco|n|a complete and embarrassing failure.|The school play turned into a fiasco when the set fell over.\nfinesse|n|skillful, delicate handling of a tricky situation.|She handled the angry customer with finesse.\nfortunate|adj|having good luck.|We were fortunate to find a table at the crowded cafe.\nfuchsia|n|a vivid purplish-pink color; also a plant with drooping flowers of that color.|She painted her bedroom door a bold fuchsia.\nfuselage|n|the main body of an aircraft.|Passengers sat in rows along the length of the fuselage.\ngauche|adj|socially awkward or tactless.|It was gauche to start eating before the host sat down.\ngazpacho|n|a cold Spanish soup made from raw tomatoes and other vegetables.|On a hot day, a bowl of gazpacho tasted perfect.\ngenuine|adj|real and not fake; sincere.|The jacket is made of genuine leather.\ngesticulate|v|to make lively hand and arm movements while speaking.|He began to gesticulate wildly as he explained the argument.\nghoulish|adj|taking morbid pleasure in death or horror.|The haunted house's ghoulish decorations made the children shriek.\ngnocchi|n|small Italian dumplings made from potato or flour.|She served the gnocchi with a sage butter sauce.\ngregarious|adj|fond of company; sociable.|The gregarious new neighbor introduced himself to every family on the block within a week.\nguillotine|n|a machine with a heavy falling blade, used for executions in France; also a paper cutter.|The guillotine was used during the French Revolution.\nhallucinate|v|to see or hear things that are not really there.|Lost in the desert, he began to hallucinate a lake.\nharangue|v|to lecture someone at length in a loud, forceful way.|The coach would harangue the team for twenty minutes after every loss.\nharass|v|to bother or pressure someone again and again.|Reporters continued to harass the family outside their home.\nhemorrhage|n|a heavy flow of blood from a damaged blood vessel.|The doctor worked quickly to stop the hemorrhage.\nhesitate|v|to pause before doing something because you feel unsure.|Don't hesitate to ask if you need help.\nhieroglyphics|n|the picture writing of ancient Egypt.|The tomb wall was covered in colorful hieroglyphics.\nhygiene|n|habits and practices that keep you clean and healthy.|Washing your hands is basic hygiene.\nhypochondriac|n|a person who constantly worries about being seriously ill.|The hypochondriac rushed to the clinic over a tiny mosquito bite.\nhypotenuse|n|the longest side of a right triangle.|The hypotenuse is always opposite the right angle.\nidiosyncrasy|n|a personal habit or quirk that is peculiar to one person.|Wearing mismatched socks was one odd idiosyncrasy he refused to give up.\nidyllic|adj|peaceful and charming, like a f milk on top.|She ordered a macchiato to wake herself up.\nmagnanimous|adj|generous and forgiving, especially toward a rival.|The magnanimous winner praised the loser's effort.\nmaintenance|n|the work of keeping something in good condition.|The elevator is closed for maintenance.\nmalevolent|adj|wishing harm on others.|The witch cast a malevolent glare at the villagers.\nmarvelous|adj|extremely good or wonderful.|The chef served a marvelous five-course dinner.\nmausoleum|n|a large building that holds tombs.|The emperor was buried in a marble mausoleum.\nmellifluous|adj|sweet and smooth to hear.|The singer's mellifluous voice calmed the restless crowd.\nmercurial|adj|changing moods quickly and unpredictably.|The mercurial artist was cheerful at breakfast and furious by lunch.\nmetamorphosis|n|a complete change of form, such as a caterpillar becoming a butterfly.|The frog's metamorphosis from tadpole took only a few weeks.\nmeticulous|adj|showing great attention to every detail.|The meticulous clockmaker checked every tiny gear.\nmillennium|n|a period of one thousand years.|The town celebrated the start of a new millennium with fireworks.\nminuscule|adj|extremely small.|The writing on the medicine bottle was minuscule.\nmisanthrope|n|a person who dislikes and avoids other people.|The misanthrope lived alone on a hill and refused all visitors.\nmiscellaneous|adj|made up of many different kinds; assorted.|The drawer was full of miscellaneous items: batteries, keys, and string.\nmischievous|adj|playfully naughty.|The mischievous puppy hid every sock in the house.\nmnemonic|n|a trick or short phrase that helps you remember something.|She used a silly mnemonic to remember the order of the planets.\nmortgage|n|a loan taken out to buy a house.|They paid off their mortgage after twenty years.\nmyriad|n|an extremely large number of things.|A myriad of stars glittered over the desert.\nnefarious|adj|wicked or criminal.|The villain unveiled his nefarious plan to steal the moon. const MODES = { mix: '混合', def: '看定義', cloze: '例句填空' };
const ALT = { realize: ['realise'], diarrhea: ['diarrhoea'], hemorrhage: ['haemorrhage'], esophagus: ['oesophagus'],
  judgment: ['judgement'], jewelry: ['jewellery'], marvelous: ['marvellous'], neighborhood: ['neighbourhood'] };

  + (ANDROID ? ' inputmode="email"' : '');

/* ---------- random: uniform, unbiased ---------- */
function rnd(n) {
  const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}
function sample(arr, k) {
  const a = arr.slice();
  for (let i = 0; i < k; i++) { const j = i + rnd(a.length - i); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, k);
}

/* ---------- storage: browser-local, falls back to memory ---------- */
let onSave = () => {};
const SYNCED = new Set(['weak', 'hist', 'prog', 'rm']);
const store = (() => {
  let ok = true; const mem = {};
  try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); } catch (e) { ok = false; }
  return {
    ok,
    get(k, d) { try { if (ok) { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } } catch (e) {} return k in mem ? mem[k] : d; },
    set(k, v, quiet) { mem[k] = v; try { if (ok) localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} if (!quiet && SYNCED.has(k)) onSave(); }
  };
})();
const prefs = Object.assign({ mode: 'mix', deck: 'all', filter: 'all', size: '25', lm: 'none', sd: 'off', pt: 'auto', ld: '' }, store.get('prefs', {}));
if (prefs.src === 'weak') { prefs.filter = 'weak'; delete prefs.src; }

const getWeak = () => store.get('weak', {});

/* ---------- decks ---------- */
function parseDeck(text, id, seen) {
  const out = [];
  for (const line of String(text || '').split('\n')) {
    const f = line.split(/\||\t/).map(x => x.trim());
    const [w, p, d, s] = f;
    if (!w || !d || !/^[A-Za-z][A-Za-z'-]*$/.test(w) || seen.has(w.toLowerCase())) continue;
    seen.add(w.toLowerCase());
    out.push({ w, p: p || '', d, s: s || '', n: out.length + 1, deck: id });
  }
  return out;
}
const DECKS = DECKDATA;
let ALL = [], WMAP = {};
function buildWords() {
  const seen = new Set();
  DECKS.forEach(d => { d.words = parseDeck(d.text, d.id, seen); });
  ALL = DECKS.flatMap(d => d.words);
  WMAP = Object.fromEntries(ALL.map(x => [x.w, x]));
}
buildWords();
const SCOPE_NAMES = { all: '全部', weekly: '所有每週', recent: '最近 4 週' };
const deckName = id => SCOPE_NAMES[id] || (DECKS.find(d => d.id === id) || {}).short || '全部';
const isWeekly = d => /^w\d/.test(d.id);
const weeklyAll = () => DECKS.filter(d => isWeekly(d) && d.words.length);
const recentIds = () => weeklyAll().slice(-4).map(d => d.id);
const validDeck = v => ['all', 'weekly', 'recent'].includes(v) || !!ownedDecks().find(d => d.id === v);
/* a designed picker (not the browser's default menu): quick scopes as rows, weeks as a grid of chips, so 50+ weeks stay easy to pick */
const CHEV = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const deckPicker = (id, val) => `<button class="pick" id="${id}" type="button" data-v="${esc(val)}" aria-haspopup="dialog"><span>${esc(deckName(val))}</span>${CHEV}</button>`;
function bindDeckPicker(id, scopes, onPick) {
  const btn = document.getElementById(id); if (!btn) return;
  btn.onclick = () => {
    const cur = btn.dataset.v, wk = weeklyAll(), other = ownedDecks().filter(d => !isWeekly(d));
    const total = ids => ALL.filter(x => ids.includes(x.deck)).length;
    const rows = [];
    if (scopes) { rows.push(['all', '全部', ALL.length]); if (wk.length > 1) rows.push(['recent', '最近 4 週', total(recentIds())]); if (wk.length) rows.push(['weekly', '所有每週字表', total(wk.map(d => d.id))]); }
    other.forEach(d => rows.push([d.id, d.short, d.words.length]));
    const back = document.createElement('div');
    back.className = 'pk-back';
    back.innerHTML = `<div class="pk" role="dialog" aria-modal="true" aria-label="選擇範圍" tabindex="-1"><div class="pk-grab"></div>
      ${rows.map(([v, l, n]) => `<button class="pk-row${v === cur ? ' on' : ''}" data-v="${v}" type="button"><span>${esc(l)}</span><span class="note">${n} 字</span></button>`).join('')}
      ${wk.length ? `<p class="pk-h">每週字表</p><div class="pk-grid">${wk.slice().reverse().map(d => `<button class="pk-chip${d.id === cur ? ' on' : ''}" data-v="${d.id}" type="button">${esc(d.short)}</button>`).join('')}</div>` : ''}</div>`;
    const close = () => { back.remove(); document.removeEventListener('keydown', onKey); btn.focus(); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    back.onclick = e => {
      const c = e.target.closest('[data-v]');
      if (c) { btn.dataset.v = c.dataset.v; btn.firstElementChild.textContent = deckName(c.dataset.v); close(); onPick(c.dataset.v); }
      else if (e.target === back) close();

    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    const sel = back.querySelector('.on'); (sel || back.querySelector('.pk')).focus({ preventScroll: true }); if (sel) sel.scrollIntoView({ block: 'center' });

}
const ownedDecks = () => DECKS.filter(d => d.words.length);

/* ---------- progress ---------- */
function recordResult(word, ok, first) {
  const wk = getWeak(), e = wk[word], pg = getProg(), p = pg[word] || { ok: 0, miss: 0, t: 0 };
  if (ok) p.ok++; else p.miss++;
  p.t = Date.now(); pg[word] = p; store.set('prog', pg);
  if (!ok) wk[word] = { miss: (e ? e.miss : 0) + 1, last: Date.now(), streak: 0 };
  else if (e && first) { e.streak = (e.streak || 0) + 1; if (e.streak >= 2) dropWeak(wk, word); }
  store.set('weak', wk); renderNav();
}
function dropWeak(wk, w) { delete wk[w]; const rm = getRm(); rm[w] = Date.now(); store.set('rm', rm); }
function logHist(rec) { const h = getHist(); h.unshift(rec); store.set('hist', h.slice(0, 200)); }
const stateOf = (w, wk, pg) => wk[w] ? 'weak' : !pg[w] ? 'new' : pg[w].ok >= 2 ? 'known' : 'learning';
function pool(deck, filter, exclude) {
  const wk = getWeak(), pg = getProg();
  const inDeck = x => deck === 'all' || (deck === 'weekly' ? /^w\d/.test(x.deck) : deck === 'recent' ? recentIds().includes(x.deck) : x.deck === deck);
  return ALL.filter(x => inDeck(x) && !(exclude && exclude.includes(x.deck)) &&
    (filter === 'all' || (filter === 'weak' ? !!wk[x.w] : !pg[x.w] && !wk[x.w])));
}
const storeNote = () => store.ok ? '' : '<p class="note" style="margin-top:20px">此環境無法長期儲存，錯字清單與記錄只在這次開啟期間保留。</p>';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = $('#app');
const pad = n => String(n).padStart(2, '0');
const fmt = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const seg = (name, opts, val) => `<div class="seg" role="radiogroup">${Object.entries(opts).map(([k, l]) =>
  `<label><input type="radio" name="${name}" value="${k}" ${k === val ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>`;
const picked = n => $(`input[name="${n}"]:checked`).value;
const STAR = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.4l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17.2l-5.4 2.9 1.1-6.1L3.2 9.8l6.1-.8z" stroke-linejoin="round"/></svg>';
const SAY = w => `<button class="say" data-say="${esc(w)}" aria-label="發音" title="發音"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" stroke-linejoin="round"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></button>`;
function speak(word) {
  if (!('speechSynthesis' in window)) return;
  try {
    const ss = window.speechSynthesis;
    if (ss.speaking || ss.pending) ss.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.9;
    const v = ss.getVoices().find(x => x.lang === 'en-US' || x.lang === 'en_US');
    if (v) u.voice = v;
    ss.speak(u);
  } catch (e) {}
}
if (!('speechSynthesis' in window)) document.documentElement.classList.add('nosay');
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) speak(b.dataset.say); });

/* words whose definitions can't be told apart: show first letter + length so the question has one answer */
const CLUSTERS = [
  ['weird', 'bizarre', 'unnatural', 'abnormal'], ['jumbo', 'gigantic', 'elephantine'], ['expensive', 'valuable'],
  ['magician', 'sorcerer', 'wizard'], ['difficult', 'tough', 'puzzling'], ['benevolent', 'humane'],
  ['ecstatic', 'joyful'], ['frightened', 'fearsome'], ['appropriate', 'ideal']
];
const HINTED = new Set(CLUSTERS.flat());
const patHint = w => (prefs.pt === 'on' || (prefs.pt !== 'off' && HINTED.has(w.w)))
  ? `<p class="pat">${esc(w.w[0])} ${Array(w.w.length - 1).fill('_').join(' ')}<span>${w.w.length} 個字母</span></p>` : '';
const maskDef = w => w.d.replace(new RegExp('\\b' + w.w + '\\w*', 'gi'), '____');
const hasCloze = w => !!w.s && new RegExp('\\b' + w.w + '\\b', 'i').test(w.s);
function splitSentence(w) {
  const m = w.s.match(new RegExp('\\b' + w.w + '\\b', 'i'));
  return [w.s.slice(0, m.index), w.s.slice(m.index + m[0].length)];
}
function make(word, mode) {
  const avail = ['def'];
  if (hasCloze(word)) avail.push('cloze');
  const type = mode === 'mix' ? avail[rnd(avail.length)] : (avail.includes(mode) ? mode : 'def');
  return { word, type };
}
function isRight(q, val) {
  const full = val.replace(/[^A-Za-z]/g, '');   // stray symbols or spaces are not spelling mistakes
  const accept = [q.word.w.replace(/[^A-Za-z]/g, ''), ...(ALT[q.word.w] || [])];
  const strict = /[A-Z]/.test(q.word.w);
  return accept.some(a => strict ? a === full : a.toLowerCase() === full.toLowerCase());
}

/* question body (before answering) and its marked version (after) */
function qBody(q, i) {
  const w = q.word, pos = (w.p ? `<span class="pos">${esc(w.p)}</span>` : '') + SAY(w.w);   // the word can always be played, as in the real contest
  if (q.type === 'def') return `<p class="prompt">${esc(maskDef(w))}${pos}</p>${patHint(w)}<input class="staff fld" data-i="${i}" aria-label="拼出單字" ${ATTR}>`;
  const [b, a] = splitSentence(w);
  return `<p class="prompt">${esc(b)}<input class="blank fld" data-i="${i}" aria-label="填入單字" ${ATTR}>${esc(a)}${pos}</p>${patHint(w)}
    ${prefs.sd === 'on' ? '' : `<button class="btn ghost sm" data-hint="${i}" type="button">看定義<span class="kbhint">　按 /</span></button>`}
    <p class="hint" id="h${i}" ${prefs.sd === 'on' ? '' : 'hidden'}>${esc(maskDef(w))}</p>`;
}
const ignored = val => { const x = (val || '').replace(/[A-Za-z]/g, '').replace(/\s/g, ''); return x ? `<span class="note">已忽略符號 ${esc(x)}</span>` : ''; };
function qDone(q, val, ok) {
  const w = q.word;
  let prompt;
  if (q.type === 'def') prompt = `<p class="prompt">${esc(maskDef(w))}${w.p ? `<span class="pos">${esc(w.p)}</span>` : ''}</p>`;
  else { const [b, a] = splitSentence(w); prompt = `<p class="prompt">${esc(b)}<span class="fill">${esc(w.w)}</span>${esc(a)}</p>`; }
  const verdict = ok
    ? `${q.type === 'def' ? `<div class="staff">${esc(w.w)}</div>` : ''}${SAY(w.w)}${ignored(val)}`
    : `<div class="staff">${esc(w.w)}</div>${SAY(w.w)}<span class="typed">${val ? esc(val) : '未作答'}</span>`;
  return `${prompt}<div class="verdict">${verdict}</div>`;
}
function bindFields(root, onChange) {
  const f = $$('.fld', root);
  f.forEach((el, k) => {
    el.setAttribute('enterkeyhint', k === f.length - 1 ? 'go' : 'next');
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); (f[k + 1] || $('#submit') || $('#act'))?.focus(); } });
    if (onChange) el.addEventListener('input', onChange);
  });
  const toggleHint = i => { const h = $('#h' + i); if (h && prefs.sd !== 'on') h.hidden = !h.hidden; };
  $$('[data-say]', root).forEach(b => { b.onmousedown = e => e.preventDefault(); });   // keep the keyboard open
  $$('[data-hint]', root).forEach(b => {
    b.onmousedown = e => e.preventDefault();          // keep focus (and the keyboard) in the answer field
    b.onclick = () => toggleHint(b.dataset.hint);
  });
  f.forEach(el => el.addEventListener('keydown', e => {
    if (e.key === '/' && $('[data-hint="' + el.dataset.i + '"]')) { e.preventDefault(); toggleHint(el.dataset.i); }
  }));

/* ---------- weekly routine: learn, retest next day, spaced reviews, all counted from a start date ---------- */
const WDN = ['日', '一', '二', '三', '四', '五', '六'], DAYMS = 864e5;
const weeklyDecks = () => DECKS.filter(d => /^w\d/.test(d.id) && d.words.length);
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const markDone = id => { const rt = store.get('rt', {}), k = ymd(new Date()); (rt[k] = rt[k] || []).includes(id) || rt[k].push(id); store.set('rt', rt, true); };
function dayKind(d, w) { return d === 0 ? '學' : d === 1 ? '測' : d === 3 ? '錯' : d === 4 && w >= 3 ? '混' : '·'; }
function todayPlan() {
  const WK = weeklyDecks(); if (!prefs.start || !WK.length) return null;
  const [y, m, d0] = prefs.start.split('-').map(Number), start = new Date(y, m - 1, d0);
  const idx = Math.round((today0() - start) / DAYMS);
  if (idx < 0) return { before: -idx, start };
  const w = Math.floor(idx / 7) + 1, d = idx % 7, have = w <= WK.length;
  const cur = WK[Math.min(w, WK.length) - 1], prev = w > 1 ? WK[Math.min(w - 1, WK.length) - 1] : null, tasks = [];
  if (d === 0) {
    if (prev) tasks.push({ id: 'scan', title: '快速掃過上週的字', note: `第 ${w - 1} 週，過一遍就好`, scope: { deck: prev.id, filter: 'all', size: 'all' } });
    tasks.push(have ? { id: 'learn', title: `學第 ${w} 週的新字`, note: '先看單字表、按喇叭聽，再練到每個字都拼對', list: cur.id, scope: { deck: cur.id, filter: 'new', size: 'all' } }
      : { id: 'learn', title: `第 ${w} 週的新字還沒加進來`, note: '跟 Claude 說「出下一週」', none: true });
  } else if (d === 1) tasks.push({ id: 'retest', title: '回測這週的字', note: '學完隔天最容易忘，這次最重要', scope: { deck: cur.id, filter: 'all', size: 'all' } });
  else if (d === 3) tasks.push({ id: 'weak', title: '錯字快測', note: '只練錯字清單', scope: { deck: 'all', filter: 'weak', size: 'all' } });
  else if (d === 4 && w >= 3) tasks.push({ id: 'mix', title: '混合複習', note: '前幾週和世新 250 字隨機抽 50 題', scope: { deck: 'all', filter: 'all', size: '50', exclude: [cur.id] } });
  tasks.forEach(t => { if (t.scope) t.scope.task = t.id; });
  return { w, d, start, tasks, cur };
}

/* full maps for the lists and the two newest weeks; every older week folds into one compact, expandable row */
function deckBlocks(wk, pg) {
  const W = weeklyAll(), pl = todayPlan(), cur = pl && pl.w ? Math.min(pl.w, W.length) - 1 : W.length - 1;
  const open = new Set(W.filter((_, i) => i === cur || i === cur - 1).map(d => d.id));
  const full = d => `<section class="deck"><div class="dh"><h2>${esc(d.name)}</h2><span class="note">${knownIn(d, wk, pg)} / ${d.words.length}</span></div>${mapOf(d, wk, pg)}</section>`;
  const fixed = ownedDecks().filter(d => !isWeekly(d)), head = fixed.filter(d => d.id !== 'base'), base = fixed.filter(d => d.id === 'base');
  const shown = W.filter(d => open.has(d.id)).reverse(), old = W.filter(d => !open.has(d.id)).reverse();
  const row = d => { const k = knownIn(d, wk, pg), pc = Math.round(k / d.words.length * 100);
    return `<details class="wrow"><summary><span>${esc(d.short)}</span><span class="mini"><i style="width:${pc}%"></i></span><span class="note">${k} / ${d.words.length}</span></summary>${mapOf(d, wk, pg)}</details>`; };
  const oldAll = old.reduce((a, d) => a + knownIn(d, wk, pg), 0), oldTot = old.reduce((a, d) => a + d.words.length, 0);

    (old.length ? `<section class="deck"><details class="oldw"><summary><h2>更早的週（${old.length}）</h2><span class="note">${oldAll} / ${oldTot}</span></summary>${old.map(row).join('')}</details></section>` : '');
}

/* ---------- staff calibration: put the baseline on the third line ---------- */
function calibrate() {
  try {
    const s = 15, m = 6, ctx = document.createElement('canvas').getContext('2d');
    ctx.font = '400 100px ' + getComputedStyle(document.body).fontFamily;
    const xh = (ctx.measureText('x').actualBoundingBoxAscent || 52) / 100;
    const F = s / xh, H = 3 * s + 2 * m;
    /* measure where the baseline really falls in a box of height H, instead of trusting font metrics */
    const probe = document.createElement('div');
    probe.style.cssText = `position:absolute;left:-9999px;top:0;visibility:hidden;height:${H}px;font:400 ${F}px/${H}px ${getComputedStyle(document.body).fontFamily}`;
    probe.innerHTML = 'x<i style="display:inline-block;width:0;height:0"></i>';
    document.body.appendChild(probe);
    const base = probe.lastChild.getBoundingClientRect().top - probe.getBoundingClientRect().top;
    probe.remove();
    const k = base - H / 2;
    const r = document.documentElement.style;
    r.setProperty('--s', s + 'px'); r.setProperty('--m', m + 'px'); r.setProperty('--F', F.toFixed(2) + 'px'); r.setProperty('--H', H + 'px');
    r.setProperty('--pt', Math.max(0, s - 2 * k).toFixed(2) + 'px'); r.setProperty('--pb', Math.max(0, 2 * k - s).toFixed(2) + 'px');
  } catch (e) {}
}

    reloaded = true; location.reload();
  });
}
calibrate();
if (document.fonts) { document.fonts.load('400 30px Andika').then(calibrate).catch(() => {}); document.fonts.ready.then(calibrate); }
route();
if (getSession()) sync();
</script>
