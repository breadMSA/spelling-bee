<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Spelling Bee 練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fb;--ink:#16233f;--mute:#667189;--rule:#d9e0ec;--line:#b4c6e3;--base:#5d82bf;
  --ok:#23704f;--bad:#b3261e;--soft:#e8edf6;
  --f:"Andika","Atkinson Hyperlegible",Verdana,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  /* four-line staff geometry, set by calibrate() */
  --s:15px;--F:29px;--m:6px;--H:57px;--pt:0px;--pb:0px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1624;--ink:#e6ecf8;--mute:#8e9ab3;--rule:#26324a;--line:#2f4166;--base:#6b8fd0;
  --ok:#63c196;--bad:#f08d85;--soft:#18223a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--f)}
main{max-width:720px;margin:0 auto;padding:28px 20px 72px}
a{color:inherit}
h2{font:700 22px/1.3 var(--f);margin:0 0 6px}
p{margin:0}
.note{color:var(--mute);font-size:14px}
:focus-visible{outline:2px solid var(--base);outline-offset:2px}

/* header + nav */
.brand{font-weight:700;font-size:20px}
.brand small{font-weight:400;font-size:13px;color:var(--mute);margin-left:10px}
nav{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:12px 0 28px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:10px 12px;color:var(--mute);text-decoration:none;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
nav .ct{font-size:12px;margin-left:5px;color:var(--mute);font-weight:400}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;border-radius:8px;
  border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font:700 15px/1 var(--f);cursor:pointer;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.sec:hover{border-color:var(--ink)}
.lt.starf{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:34px}
.lt.starf svg{fill:none;stroke:currentColor;stroke-width:1.7}
.lt.starf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lt.starf[aria-pressed="true"] svg{fill:currentColor}
.btn.ghost{background:none;border-color:transparent;color:var(--mute);font-weight:400;padding:0 10px;text-decoration:underline;text-underline-offset:4px}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}

/* segmented control */
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:18px 0 0}
.lab{color:var(--mute);font-size:14px;min-width:3.5em}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden}
.seg label{position:relative;display:flex;align-items:center;height:40px;padding:0 16px;font-size:14px;color:var(--mute);cursor:pointer}
.seg label+label{border-left:1.5px solid var(--rule)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--base);outline-offset:-4px}

/* four-line staff: the writing line for English words */
.staff{display:block;width:100%;max-width:26rem;height:var(--H);padding:var(--pt) 6px var(--pb);
  font:400 var(--F)/calc(var(--H) - var(--pt) - var(--pb)) var(--f);letter-spacing:.03em;color:var(--ink);
  border:0;border-radius:0;outline:0;margin:0;
  background:
    linear-gradient(var(--line),var(--line)) 0 var(--m)/100% 1px no-repeat,
    linear-gradient(var(--line),var(--line)) 0 calc(var(--m) + var(--s))/100% 1px no-repeat,
    linear-gradient(var(--base),var(--base)) 0 calc(var(--m) + 2*var(--s))/100% 1px no-repeat,
    linear-gradient(var(--line),var(--line)) 0 calc(var(--m) + 3*var(--s))/100% 1px no-repeat}
input.staff{background-color:transparent}
input.staff:focus{--line:var(--base)}
div.staff{display:inline-block;width:auto;min-width:14rem;white-space:nowrap}
.blank{display:inline-block;width:9em;max-width:60vw;margin:0 .2em;padding:0 6px;border:0;border-bottom:1.5px solid var(--ink);
  background:transparent;color:var(--ink);font:inherit;text-align:center;border-radius:0}
.blank:focus{outline:0;border-bottom-color:var(--base);box-shadow:0 1.5px 0 var(--base)}

/* quiz + practice items */
.q{display:grid;grid-template-columns:2.6rem 1fr;padding:22px 0;border-top:1px solid var(--rule)}
.q .no{color:var(--mute);padding-top:2px}
.q .body{padding-left:14px;border-left:2px solid transparent}
.q.ok .body{border-left-color:var(--ok)}
.q.no .body{border-left-color:var(--bad)}
.prompt{font-size:18px;line-height:1.7;margin-bottom:12px}
.prompt .pos{color:var(--mute);font-size:13px;margin-left:6px}
.prompt .fill{border-bottom:2px solid var(--ink)}
.hint{margin-top:8px;color:var(--mute);font-size:14px}
.verdict{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.v{font-size:13px;font-weight:700}
.v.ok{color:var(--ok)}.v.bad{color:var(--bad)}
.typed{color:var(--mute);text-decoration:line-through;font-size:16px}
.onlywrong .q.ok{display:none}
.dock{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;background:var(--bg);border-top:1px solid var(--ink)}
.sumry{padding-bottom:26px}
.score{display:flex;align-items:baseline;gap:10px}
.score .n{font-size:64px;font-weight:700;line-height:1}
.score .of{color:var(--mute);font-size:18px}
.pcard{padding:8px 0 4px}
.pcard .prompt{font-size:22px}
.pcard .body{padding-left:14px;border-left:2px solid transparent}
.pcard.ok .body{border-left-color:var(--ok)}.pcard.no .body{border-left-color:var(--bad)}
.pbar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ink)}
.phead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 28px}

/* word list */
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.find{height:44px;width:100%;max-width:20rem;padding:0 14px;border:1.5px solid var(--rule);border-radius:8px;background:transparent;color:var(--ink);font:inherit}
.find:focus{outline:0;border-color:var(--base)}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.lt{min-width:34px;height:34px;padding:0 8px;border-radius:6px;border:1px solid var(--rule);background:none;color:var(--ink);font:400 14px var(--f);cursor:pointer}
.lt.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.entry{display:grid;grid-template-columns:2.6rem 1fr auto;column-gap:8px;padding:16px 0;border-top:1px solid var(--rule)}
.entry[hidden]{display:none}
.star{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:8px;color:var(--mute);cursor:pointer}
.star svg{fill:none;stroke:currentColor;stroke-width:1.6}
.star:hover{color:var(--ink)}
.star.on{color:var(--ink)}
.star.on svg{fill:currentColor}
.entry .no{color:var(--mute);font-size:14px;padding-top:4px}
.w{font-weight:700;font-size:21px;line-height:1.4}
.pos{color:var(--mute);font-size:13px;font-weight:400;margin-left:8px}
.d{margin:2px 0 4px}
.s{color:var(--mute);font-size:14px}
.s b,.d b{color:var(--ink)}
.m-word .w:not(.rev){filter:blur(7px);cursor:pointer;user-select:none}
.m-def .d:not(.rev),.m-def .s:not(.rev){filter:blur(6px);cursor:pointer;user-select:none}
.meta{color:var(--mute);font-size:13px;margin-top:4px}
.empty{padding:28px 0;color:var(--mute)}
.empty .btn{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{padding:3px 10px;border:1px solid var(--rule);border-radius:6px}

/* history */
.h{border-top:1px solid var(--rule)}
.h summary{display:grid;grid-template-columns:7.2em 1fr auto;gap:12px;align-items:baseline;padding:14px 0;cursor:pointer;list-style:none}
.h summary::-webkit-details-marker{display:none}
.h .sc{font-weight:700;font-size:18px}
.h .wl{padding:0 0 16px 7.2em}
.h .wl div{display:flex;gap:14px;align-items:baseline}
@media (max-width:520px){
  .h .wl{padding-left:0}
  .h summary{grid-template-columns:6em 1fr auto}
  .score .n{font-size:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="brand">Spelling Bee<small>世新 250 字</small></div>
  <nav id="nav"></nav>
  <div id="app"></div>
</main>

/* ---------- random: uniform, unbiased ---------- */
function rnd(n) {
  const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}
function sample(arr, k) {
  const a = arr.slice();
  for (let i = 0; i < k; i++) { const j = i + rnd(a.length - i); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, k);
}

/* ---------- storage: browser-local, falls back to memory ---------- */
const store = (() => {
  let ok = true; const mem = {};
  try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); } catch (e) { ok = false; }
  return {
    ok,
    get(k, d) { try { if (ok) { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } } catch (e) {} return k in mem ? mem[k] : d; },
    set(k, v) { mem[k] = v; try { if (ok) localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
})();

  const wk = getWeak(), e = wk[word];
  if (!ok) wk[word] = { miss: (e ? e.miss : 0) + 1, last: Date.now(), streak: 0 };
  else if (e && first) { e.streak = (e.streak || 0) + 1; if (e.streak >= 2) delete wk[word]; }

}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const seg = (name, opts, val) => `<div class="seg" role="radiogroup">${Object.entries(opts).map(([k, l]) =>
  `<label><input type="radio" name="${name}" value="${k}" ${k === val ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>`;
const picked = n => $(`input[name="${n}"]:checked`).value;
const maskDef = w => w.d.replace(new RegExp('\\b' + w.w + '\\w*', 'gi'), '____');
function splitSentence(w) {
  const m = w.s.match(new RegExp('\\b' + w.w + '\\b', 'i'));
  return [w.s.slice(0, m.index), w.s.slice(m.index + m[0].length)];
}
function make(word, mode) {
  const avail = ['def'];
  if (new RegExp('\\b' + word.w + '\\b', 'i').test(word.s)) avail.push('cloze');
  const type = mode === 'mix' ? avail[rnd(avail.length)] : (avail.includes(mode) ? mode : 'def');
  return { word, type };
}
function isRight(q, val) {
  const full = val.trim();
  const accept = [q.word.w, ...(ALT[q.word.w] || [])];
  const strict = /[A-Z]/.test(q.word.w);
  return accept.some(a => strict ? a === full : a.toLowerCase() === full.toLowerCase());
}

/* question body (before answering) and its marked version (after) */
function qBody(q, i) {
  const w = q.word, pos = `<span class="pos">${esc(w.p)}</span>`;
  if (q.type === 'def') return `<p class="prompt">${esc(maskDef(w))}${pos}</p><input class="staff fld" data-i="${i}" aria-label="拼出單字" ${ATTR}>`;
  const [b, a] = splitSentence(w);
  return `<p class="prompt">${esc(b)}<input class="blank fld" data-i="${i}" aria-label="填入單字" ${ATTR}>${esc(a)}${pos}</p>
    <button class="btn ghost sm" data-hint="${i}" type="button">看定義</button><p class="hint" id="h${i}" hidden>${esc(maskDef(w))}</p>`;
}
function qDone(q, val, ok) {
  const w = q.word;
  let prompt;
  if (q.type === 'def') prompt = `<p class="prompt">${esc(maskDef(w))}<span class="pos">${esc(w.p)}</span></p>`;
  else { const [b, a] = splitSentence(w); prompt = `<p class="prompt">${esc(b)}<span class="fill">${esc(w.w)}</span>${esc(a)}</p>`; }
  const verdict = ok
    ? `<span class="v ok">正確</span>${q.type === 'def' ? `<div class="staff">${esc(w.w)}</div>` : ''}`
    : `<span class="v bad">錯誤</span><div class="staff">${esc(w.w)}</div><span class="typed">${val ? esc(val) : '未作答'}</span>`;
  return `${prompt}<div class="verdict">${verdict}</div>`;
}
function bindFields(root, onChange) {
  const f = $$('.fld', root);
  f.forEach((el, k) => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); (f[k + 1] || $('#submit') || $('#act'))?.focus(); } });
    if (onChange) el.addEventListener('input', onChange);
  });
  $$('[data-hint]', root).forEach(b => b.onclick = () => { const h = $('#h' + b.dataset.hint); h.hidden = !h.hidden; });
  return f;
}

      return `<div class="entry" data-w="${esc(w.w)}" data-l="${w.w[0].toLowerCase()}" data-t="${esc((w.w + ' ' + w.d).toLowerCase())}">
        <div class="no">${w.n}</div>
        <div><div><span class="w">${esc(w.w)}</span><span class="pos">${esc(w.p)}</span></div>
          <div class="d">${esc(w.d)}</div><div class="s">${esc(w.s).replace(re, '<b>$1</b>')}</div></div>
        <button class="star${wk[w.w] ? ' on' : ''}" data-flag="${esc(w.w)}" aria-pressed="${!!wk[w.w]}" aria-label="標記為不會" title="標記為不會">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.4l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17.2l-5.4 2.9 1.1-6.1L3.2 9.8l6.1-.8z" stroke-linejoin="round"/></svg></button></div>`;
    }).join('')}</div>`;
  let L = '';
  const apply = () => {
    const t = $('#find').value.trim().toLowerCase(), S = $('#starf').getAttribute('aria-pressed') === 'true'; let n = 0;
    $$('.entry').forEach(e => {
      const show = (!L || e.dataset.l === L) && (!t || e.dataset.t.includes(t)) && (!S || e.querySelector('.star.on'));
      e.hidden = !show; if (show) n++;
    });
    $('#shown').textContent = n === WORDS.length ? '' : `${n} 字`;
    $('#none').hidden = n > 0;
  };
  const starCount = () => { const c = Object.keys(getWeak()).length; $('#sc').textContent = c ? c : ''; };
  starCount();
  $('#find').oninput = apply;
  $('#letters').onclick = e => {
    const b = e.target.closest('.lt'); if (!b) return;
    if (b.id === 'starf') { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); apply(); return; }
    L = b.dataset.l; $$('.lt[data-l]').forEach(x => x.classList.toggle('on', x === b)); apply();
  };
  $$('input[name="lm"]').forEach(r => r.onchange = () => {
    prefs.lm = picked('lm'); savePrefs();
    $('#entries').className = prefs.lm === 'word' ? 'm-word' : prefs.lm === 'def' ? 'm-def' : '';
    $$('.rev').forEach(x => x.classList.remove('rev'));
  });
  $('#entries').onclick = e => {
    const fl = e.target.closest('[data-flag]');
    if (fl) {
      const w = fl.dataset.flag, wk = getWeak();
      if (wk[w]) delete wk[w]; else wk[w] = { miss: 0, last: Date.now(), streak: 0, manual: true };
      store.set('weak', wk); fl.classList.toggle('on', !!wk[w]); fl.setAttribute('aria-pressed', !!wk[w]); renderNav(); starCount(); return;
    }
    const t = e.target.closest('.w,.d,.s'); if (t) t.classList.add('rev');
  };
}

/* ---------- quiz ---------- */
let qs = [], retry = false;
function viewQuiz() {
  const last = getHist().find(h => h.kind === 'quiz');
  app.innerHTML = `
    <h2>測驗</h2>
    <p class="note">從 250 字中不重複隨機抽 25 題，每題 4 分。</p>
    <div class="row"><span class="lab">題型</span>${seg('mode', MODES, prefs.mode)}</div>
    <div class="actions"><button class="btn" id="go">開始測驗</button></div>
    ${last ? `<p class="note" style="margin-top:28px">上次 ${fmt(last.t)}，${last.right * 4} 分（${last.right}/${last.total}）。<a href="#history">全部記錄</a></p>` : ''}
    ${storeNote()}`;
  $('#go').onclick = () => { prefs.mode = picked('mode'); savePrefs(); startQuiz(); };
}
function startQuiz(list) {
  retry = !!list;
  qs = list || sample(WORDS, N).map(w => make(w, prefs.mode));
  app.innerHTML = `<div id="paper">${qs.map((q, i) =>
    `<div class="q" id="q${i}"><div class="no">${i + 1}</div><div class="body">${qBody(q, i)}</div></div>`).join('')}</div>
    <div class="dock"><span class="note" id="cnt"></span><button class="btn" id="submit">交卷</button></div>`;
  const count = () => { $('#cnt').textContent = `已填 ${f.filter(x => x.value.trim()).length} / ${qs.length}`; };
  const f = bindFields(app, count);
  count(); f[0] && f[0].focus();
  $('#submit').onclick = gradeQuiz;
}
function gradeQuiz() {
  let right = 0; const wrong = [];
  qs.forEach((q, i) => {
    const val = $(`input[data-i="${i}"]`).value.trim(), ok = isRight(q, val);
    q.ok = ok; if (ok) right++; else wrong.push({ w: q.word.w, a: val });
    recordResult(q.word.w, ok, true);
    const row = $('#q' + i); row.classList.add(ok ? 'ok' : 'no');
    row.querySelector('.body').innerHTML = qDone(q, val, ok);
  });
  logHist({ t: Date.now(), kind: 'quiz', mode: prefs.mode, retry, right, total: qs.length, wrong });
  $('.dock').remove();
  app.insertAdjacentHTML('afterbegin', `<section class="sumry">
    <div class="score"><span class="n">${right * 4}</span><span class="of">/ ${qs.length * 4} 分</span></div>
    <p class="note">${right} / ${qs.length} 題正確${retry ? '（重做）' : ''}</p>
    <div class="actions">${wrong.length ? '<button class="btn" id="redo">只重做錯的</button>' : ''}
      <button class="btn sec" id="again">重新抽 25 題</button>
      ${wrong.length ? '<button class="btn ghost" id="onlywrong">只看錯的</button>' : ''}
      <a class="btn ghost" href="#weak">錯字清單</a></div></section>`);
  window.scrollTo(0, 0);
  $('#again').onclick = () => startQuiz();
  if (wrong.length) {
    $('#redo').onclick = () => startQuiz(qs.filter(q => !q.ok).map(q => make(q.word, prefs.mode)));
    $('#onlywrong').onclick = e => { const p = $('#paper'); p.classList.toggle('onlywrong'); e.target.textContent = p.classList.contains('onlywrong') ? '顯示全部' : '只看錯的'; };
  }
}

/* ---------- practice: one at a time, misses return a few cards later ---------- */
let P = null;
function viewPractice() {
  const wn = Object.keys(getWeak()).length;
  app.innerHTML = `
    <h2>逐題練習</h2>
    <p class="note">一次一題，答完馬上對答案。答錯的字隔幾題會再出現，拼對才算過。</p>
    <div class="row"><span class="lab">範圍</span>${seg('src', { all: '全部 250 字', weak: `只練錯字（${wn}）` }, prefs.src)}</div>
    <div class="row"><span class="lab">題型</span>${seg('mode', MODES, prefs.mode)}</div>
    <div class="actions"><button class="btn" id="go">開始練習</button></div>
    <p class="note" style="margin-top:28px">在測驗或練習中拼錯的字會進錯字清單。之後連續兩次一次就拼對，會自動移出。</p>${storeNote()}`;
  $('#go').onclick = () => { prefs.src = picked('src'); prefs.mode = picked('mode'); savePrefs(); startPractice(); };
}
function startPractice() {
  const wk = getWeak();
  const pool = prefs.src === 'weak' ? WORDS.filter(w => wk[w.w]) : WORDS;
  if (!pool.length) {
    app.innerHTML = `<div class="empty">錯字清單目前是空的。先做一次測驗或練習，拼錯的字會記在這裡。<br><a class="btn" href="#quiz">去做測驗</a></div>`;
    return;
  }
  P = { queue: sample(pool, pool.length).map(w => make(w, prefs.mode)), total: pool.length, first: 0, failed: new Set() };
  card();
}
const leftWords = () => new Set(P.queue.map(x => x.word.w)).size;
function card() {
  if (!P.queue.length) return endPractice();
  const q = P.queue[0], done = P.total - leftWords();
  app.innerHTML = `<div class="pbar"><i style="width:${done / P.total * 100}%"></i></div>
    <div class="phead"><span class="note">${done} / ${P.total}</span><button class="btn ghost sm" id="stop">結束</button></div>
    <div class="pcard" id="q0"><div class="body">${qBody(q, 0)}</div></div>
    <div class="actions"><button class="btn" id="act">檢查</button><span class="note">按 Enter</span></div>`;
  const f = bindFields(app); f[0].focus();
  f[0].addEventListener('keydown', e => { if (e.key === 'Enter' && !f[0].disabled) check(); });
  $('#act').onclick = check; $('#stop').onclick = endPractice;
}
function check() {
  const el = $('input[data-i="0"]'); if (!el) return;
  const q = P.queue.shift(), val = el.value.trim(), ok = isRight(q, val), w = q.word.w;
  const firstTry = !P.failed.has(w);
  if (ok) { if (firstTry) P.first++; recordResult(w, true, firstTry); }
  else { P.failed.add(w); recordResult(w, false, false); P.queue.splice(Math.min(P.queue.length, 6), 0, make(q.word, prefs.mode)); }
  const box = $('#q0'); box.classList.add(ok ? 'ok' : 'no');
  box.querySelector('.body').innerHTML = qDone(q, val, ok);
  const act = $('#act'); act.textContent = '下一題'; act.onclick = card; act.focus();
}
function endPractice() {
  const answered = P.total - leftWords(), miss = [...P.failed];
  if (answered > 0) logHist({ t: Date.now(), kind: 'practice', mode: prefs.mode, src: prefs.src, right: P.first, total: answered, wrong: miss.map(w => ({ w })) });
  app.innerHTML = `<section class="sumry"><div class="score"><span class="n">${P.first}</span><span class="of">/ ${answered} 一次就拼對</span></div>
    ${miss.length ? `<p class="note" style="margin-top:10px">這輪拼錯過的字</p><div class="chips">${miss.map(w => `<span class="chip">${esc(w)}</span>`).join('')}</div>` : '<p class="note" style="margin-top:10px">這輪沒有拼錯。</p>'}
    <div class="actions"><button class="btn" id="again">再練一輪</button><a class="btn sec" href="#weak">錯字清單</a></div></section>`;
  $('#again').onclick = startPractice;
}

/* ---------- weak words ---------- */
let wmask = false;
function viewWeak() {
  const items = Object.entries(getWeak()).map(([w, e]) => ({ ...e, word: WMAP[w] })).filter(x => x.word)
    .sort((a, b) => b.miss - a.miss || b.last - a.last);
  if (!items.length) {
    app.innerHTML = `<h2>錯字清單</h2><div class="empty">還沒有錯字。測驗或練習中拼錯的字會出現在這裡，也可以在單字表手動標記。<br>
      <a class="btn" href="#practice">開始練習</a></div>${storeNote()}`;
    return;
  }
  app.innerHTML = `<h2>錯字清單</h2><p class="note">共 ${items.length} 字，錯最多次的在最上面。</p>
    <div class="actions" style="margin-top:16px"><button class="btn" id="prac">練習這些字</button>
      <button class="btn sec" id="mask">${wmask ? '顯示單字' : '遮住單字'}</button>
      <button class="btn ghost" id="clr">清除全部</button></div>
    <div id="wl" class="${wmask ? 'm-word' : ''}" style="margin-top:22px">
    ${items.map(x => `<div class="entry" data-w="${esc(x.word.w)}"><div class="no">${x.word.n}</div>
      <div><div><span class="w">${esc(x.word.w)}</span><span class="pos">${esc(x.word.p)}</span></div>
        <div class="d">${esc(x.word.d)}</div>
        <div class="meta">${x.miss ? `錯 ${x.miss} 次，` : '手動標記，'}連對 ${x.streak || 0} / 2，${fmt(x.last)}</div></div>
      <button class="btn ghost sm" data-rm="${esc(x.word.w)}">移除</button></div>`).join('')}</div>${storeNote()}`;
  $('#prac').onclick = () => { prefs.src = 'weak'; savePrefs(); startPractice(); };
  $('#mask').onclick = () => { wmask = !wmask; viewWeak(); };
  let armed = false;
  $('#clr').onclick = e => {
    if (!armed) { armed = true; e.target.textContent = '再按一次清除'; setTimeout(() => { armed = false; if (e.target.isConnected) e.target.textContent = '清除全部'; }, 3000); return; }
    store.set('weak', {}); renderNav(); viewWeak();
  };
  $('#wl').onclick = e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { const wk = getWeak(); delete wk[rm.dataset.rm]; store.set('weak', wk); renderNav(); viewWeak(); return; }
    const t = e.target.closest('.w'); if (t) t.classList.add('rev');
  };
}

/* ---------- history ---------- */
function viewHistory() {
  const h = getHist();
  if (!h.length) {
    app.innerHTML = `<h2>記錄</h2><div class="empty">還沒有記錄。完成一次測驗或練習後會出現在這裡。<br><a class="btn" href="#quiz">去做測驗</a></div>${storeNote()}`;
    return;
  }
  const quizzes = h.filter(x => x.kind === 'quiz');
  const stat = quizzes.length ? `測驗 ${quizzes.length} 次，平均 ${Math.round(quizzes.reduce((a, x) => a + x.right / x.total * 100, 0) / quizzes.length)} 分，最高 ${Math.round(Math.max(...quizzes.map(x => x.right / x.total * 100)))} 分。` : '';
  app.innerHTML = `<h2>記錄</h2><p class="note">${stat}最近 ${h.length} 筆。</p>
    <div style="margin-top:18px">${h.map(x => {
      const label = x.kind === 'quiz' ? `測驗，${MODES[x.mode] || ''}${x.retry ? '，重做' : ''}` : `練習，${x.src === 'weak' ? '錯字' : '全部'}`;
      const score = x.kind === 'quiz' ? `${Math.round(x.right / x.total * 100)} 分` : `${x.right} / ${x.total}`;
      const sub = x.kind === 'quiz' ? `${x.right} / ${x.total}` : '一次拼對';
      const wl = x.wrong.length ? x.wrong.map(y => `<div><b>${esc(y.w)}</b>${y.a !== undefined ? `<span class="typed">${y.a ? esc(y.a) : '未作答'}</span>` : ''}</div>`).join('') : '<span class="note">全對</span>';
      return `<details class="h"><summary><span class="note">${fmt(x.t)}</span><span>${label}</span><span><span class="sc">${score}</span> <span class="note">${sub}</span></span></summary>
        <div class="wl">${wl}</div></details>`;
    }).join('')}</div>
    <div class="actions"><button class="btn ghost" id="clr">清除記錄</button></div>${storeNote()}`;
  let armed = false;
  $('#clr').onclick = e => {
    if (!armed) { armed = true; e.target.textContent = '再按一次清除'; setTimeout(() => { armed = false; if (e.target.isConnected) e.target.textContent = '清除記錄'; }, 3000); return; }
    store.set('hist', []); viewHistory();
  };
}

/* ---------- staff calibration: put the baseline on the third line ---------- */
function calibrate() {
  try {
    const s = 15, m = 6, ctx = document.createElement('canvas').getContext('2d');
    ctx.font = '400 100px ' + getComputedStyle(document.body).fontFamily;
    const xh = (ctx.measureText('x').actualBoundingBoxAscent || 52) / 100;
    const F = s / xh, H = 3 * s + 2 * m;
    /* measure where the baseline really falls in a box of height H, instead of trusting font metrics */
    const probe = document.createElement('div');
    probe.style.cssText = `position:absolute;left:-9999px;top:0;visibility:hidden;height:${H}px;font:400 ${F}px/${H}px ${getComputedStyle(document.body).fontFamily}`;
    probe.innerHTML = 'x<i style="display:inline-block;width:0;height:0"></i>';
    document.body.appendChild(probe);
    const base = probe.lastChild.getBoundingClientRect().top - probe.getBoundingClientRect().top;
    probe.remove();
    const k = base - H / 2;
    const r = document.documentElement.style;
    r.setProperty('--s', s + 'px'); r.setProperty('--m', m + 'px'); r.setProperty('--F', F.toFixed(2) + 'px'); r.setProperty('--H', H + 'px');
    r.setProperty('--pt', Math.max(0, s - 2 * k).toFixed(2) + 'px'); r.setProperty('--pb', Math.max(0, 2 * k - s).toFixed(2) + 'px');
  } catch (e) {}
}
calibrate();
if (document.fonts) { document.fonts.load('400 30px Andika').then(calibrate).catch(() => {}); document.fonts.ready.then(calibrate); }
route();
</script>
